name: Deploy WalkForm to TestFlight

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  deploy:
    name: Build & Upload to TestFlight
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install xcodegen
        run: |
          brew install xcodegen

      - name: Generate Xcode Project
        run: |
          xcodegen generate

      - name: Setup Fastlane
        run: |
          mkdir -p fastlane
          cat << 'EOF' > fastlane/Appfile
          app_identifier("com.aistudio.walkform.aiwkgx")
          EOF

          cat << 'EOF' > fastlane/Fastfile
          default_platform(:ios)

          platform :ios do
            desc "Push a new build to TestFlight"
            lane :beta do
              setup_ci

              key_id = ENV["APPSTORE_KEY_ID"].to_s.strip
              issuer_id = ENV["APPSTORE_ISSUER_ID"].to_s.strip
              raw_key = ENV["APPSTORE_PRIVATE_KEY"].to_s.gsub("\r\n", "\n").strip

              key_path = File.expand_path("~/AuthKey_#{key_id}.p8")
              File.write(key_path, raw_key + "\n")

              api_key = app_store_connect_api_key(
                key_id: key_id,
                issuer_id: issuer_id,
                key_filepath: key_path,
                in_house: false
              )

              get_certificates(
                api_key: api_key
              )

              get_provisioning_profile(
                api_key: api_key,
                app_identifier: "com.aistudio.walkform.aiwkgx"
              )

              update_project_provisioning(
                xcodeproj: "WalkForm.xcodeproj",
                profile: ENV["SIGH_PROFILE_PATH"],
                target_filter: "WalkForm",
                build_configuration: "Release"
              )

              build_app(
                project: "WalkForm.xcodeproj",
                scheme: "WalkForm",
                configuration: "Release",
                export_method: "app-store",
                clean: true,
                export_options: {
                  signingStyle: "manual",
                  provisioningProfiles: {
                    "com.aistudio.walkform.aiwkgx" => ENV["SIGH_NAME"]
                  }
                }
              )

              upload_to_testflight(
                api_key: api_key,
                skip_waiting_for_build_processing: true
              )
            end
          end
          EOF

      - name: Build and Deploy via Fastlane
        env:
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          APPSTORE_PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
        run: |
          fastlane beta
