name: Deploy WalkForm to TestFlight

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build_and_deploy:
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: sudo xcode-select -switch /Applications/Xcode.app

      - name: Install xcodegen and fastlane
        run: |
          brew install xcodegen
          gem install bundler
          gem install fastlane

      - name: Generate Xcode Project
        run: |
          xcodegen generate

      - name: Create Fastfile
        run: |
          mkdir -p fastlane
          cat << 'EOF' > fastlane/Fastfile
          default_platform(:ios)

          platform :ios do
            desc "Build and upload to TestFlight"
            lane :beta do
              api_key = app_store_connect_api_key(
                key_id: ENV["APPSTORE_KEY_ID"],
                issuer_id: ENV["APPSTORE_ISSUER_ID"],
                key_content: ENV["APPSTORE_PRIVATE_KEY"],
                is_key_content_base64: false,
                in_house: false
              )

              keychain_name = "fastlane_tmp_keychain"
              keychain_password = "fastlane_password"

              create_keychain(
                name: keychain_name,
                password: keychain_password,
                default_keychain: true,
                unlock: true,
                timeout: 3600,
                lock_when_sleeps: false
              )

              cert(
                api_key: api_key,
                keychain_path: File.expand_path("~/Library/Keychains/#{keychain_name}-db"),
                keychain_password: keychain_password,
                skip_set_partition_list: true
              )

              sigh(
                api_key: api_key,
                app_identifier: "com.aistudio.walkform.aiwkgx",
                force: true
              )

              profile_path = lane_context[SharedValues::SIGH_PROFILE_PATH] || Dir.glob("../*.mobileprovision").first || "AppStore_com.aistudio.walkform.aiwkgx.mobileprovision"
              profile_name = lane_context[SharedValues::SIGH_NAME]

              UI.message("Target Profile Path: #{profile_path}")
              UI.message("Target Profile Name: #{profile_name}")

              team_id = sh("security cms -D -i \"#{profile_path}\" | plutil -extract TeamIdentifier.0 raw -").strip
              UI.message("Extracted Team ID: #{team_id}")

              update_project_team(
                path: "WalkForm.xcodeproj",
                teamid: team_id
              )

              build_app(
                project: "WalkForm.xcodeproj",
                scheme: "WalkForm",
                export_method: "app-store",
                export_options: {
                  signingStyle: "manual",
                  provisioningProfiles: {
                    "com.aistudio.walkform.aiwkgx" => profile_name
                  }
                },
                xcargs: "DEVELOPMENT_TEAM=#{team_id}"
              )

              upload_to_testflight(
                api_key: api_key,
                skip_waiting_for_build_processing: true
              )
            end
          end
          EOF

      - name: Build and Deploy via Fastlane
        env:
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          APPSTORE_PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
        run: |
          fastlane beta
